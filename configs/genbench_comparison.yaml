# Batch comparison configuration for all generated GenBench-MILP datasets.

data_root: /mnt/data1/luoyidong/benchmark_data/data
output_root: ${hydra:runtime.cwd}/outputs/genbench_milp_comparison
date_tag: ${now:%Y%m%d}

# Available tasks: manifest, audit, commands, similarity, feasibility, status
tasks:
  - manifest
  - audit
  - commands

audit:
  small_file_bytes: 100
  readability_samples: 3
  # Compare PySCIPOpt and Gurobi signatures to catch parser-specific LP corruption.
  reader: both

similarity:
  num_workers: 64
  num_samples: 1000
  seed: 42
  save_plots: true
  reuse_cache: true

selection:
  dataset_ids: []
  comparison_ids: []
  methods: []
  problems: []
  etas: []
  limit: null

feasibility:
  n_jobs: 64
  skip_existing: true
  max_instances: null

solve:
  time_limit: 300
  threads: 1
  max_parallel_jobs: 64

logging:
  level: INFO
  format: "[%(asctime)s][%(name)s][%(levelname)s] - %(message)s"

hydra:
  job:
    chdir: false
  run:
    dir: ${output_root}/${date_tag}/hydra/${now:%H-%M-%S}
  output_subdir: null
